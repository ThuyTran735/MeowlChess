<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Select the extracted extension folder</title>
  <desc id="desc">Example: Documents, MeowlChess, extension. Open MeowlChess, open extension, then click Select Folder. Do not choose the ZIP or the outer MeowlChess folder. The folder picker may hide manifest.json; that is normal.</desc>
  <rect width="1000" height="410" rx="18" fill="#232721"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="32" y="47" fill="#f1f2ec" font-size="25" font-weight="700">The folder you need is called extension</text>
    <text x="32" y="76" fill="#b5c1ac" font-size="15">Windows example · after downloading and extracting MeowlChess.zip</text>
    <rect x="32" y="102" width="936" height="47" rx="7" fill="#333c2d"/>
    <text x="51" y="132" fill="#e4ebdc" font-size="19">Documents  ›  MeowlChess  ›</text>
    <text x="338" y="132" fill="#c4e39e" font-size="19" font-weight="700">extension</text>
    <rect x="32" y="167" width="442" height="155" rx="10" fill="#1d221b" stroke="#4c5943"/>
    <text x="54" y="196" fill="#b7c2ae" font-size="14">INSIDE THE EXTRACTED MeowlChess FOLDER</text>
    <rect x="48" y="211" width="410" height="43" rx="6" fill="#435735" stroke="#a8c78a"/>
    <path d="M63 223h13l5 5h17v17H63z" fill="#d6b76e"/>
    <text x="112" y="239" fill="#f1f6e9" font-size="19" font-weight="700">extension</text>
    <text x="334" y="238" fill="#cae3b0" font-size="14">OPEN THIS</text>
    <text x="65" y="285" fill="#8d9983" font-size="16">README.md</text>
    <text x="65" y="308" fill="#8d9983" font-size="16">Other project files…</text>
    <path d="M491 241h36m-10-9 10 9-10 9" fill="none" stroke="#a8c78a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="550" y="194" fill="#f1f2ec" font-size="17" font-weight="600">1. Double-click MeowlChess.</text>
    <text x="550" y="226" fill="#f1f2ec" font-size="17" font-weight="600">2. Double-click extension.</text>
    <text x="550" y="258" fill="#f1f2ec" font-size="17" font-weight="600">3. Click the folder-selection button:</text>
    <rect x="550" y="276" width="190" height="46" rx="7" fill="#a8c78a"/>
    <text x="645" y="305" text-anchor="middle" fill="#1c2b14" font-size="17" font-weight="700">Select Folder</text>
    <text x="32" y="358" fill="#e1e8da" font-size="16">Your chosen path should end in …\MeowlChess\extension</text>
    <text x="32" y="384" fill="#b5c1ac" font-size="14">The folder picker may hide files such as manifest.json. Select the folder—not a file inside it.</text>
  </g>
</svg>
